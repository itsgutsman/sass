
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>It's Gutsman!</title>
  <meta name="description" content="GUTSMAN SASS!">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Social previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="IT'S GUTSMAN!">
  <meta property="og:description" content="GUTSMAN SASS!">
  <meta property="og:url" content="https://gutsmansass.com/">
  <meta property="og:image" content="https://gutsmansass.com/preview.png">
  <meta property="og:image:width" content="800">
  <meta property="og:image:height" content="800">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 16px;
      box-sizing: border-box;
      background: black url("sass.png") repeat;
    }

    h1 {
      font-size: clamp(2rem, 8vw, 64px);
      text-align: center;
      color: yellow;
      text-shadow:
        2px 2px 0 black,
        -2px -2px 0 black,
        -2px 2px 0 black,
        2px -2px 0 black,
        10px 5px 0 red,
        -10px -5px 0 gray;
    }

    video {
      display: block;
      width: 480px;
      max-width: 100%;
      max-height: 100vh;
      border-radius: 32px;
      overflow: hidden;
    }

    a {
      font-size: 24px;
      text-align: center;
    }
  </style>
</head>

<body>
  <h1>IT'S GUTSMAN!</h1>

  <video id="video" controls autoplay muted loop playsinline>
    <source src="sassy.mp4" type="video/mp4">
  </video>

  <a href="https://www.youtube.com/watch?v=B5TBeX405bc"
     target="_blank"
     rel="noopener noreferrer">
    Link to original video
  </a>

  <script>
    const video = document.getElementById('video');

    // Enable sound on the first click anywhere on the page.
    document.addEventListener('click', () => {
      video.muted = false;
    }, { once: true });
  </script>
</body>
</html>
